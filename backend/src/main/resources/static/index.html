<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InterviewGym · AI 模拟面试官</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --accent: #2563eb; --accent-ink: #ffffff; --ok: #16a34a; --warn: #dc2626;
    --line: #e5e7eb; --chip: #eef2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; line-height: 1.65;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
  header h1 { font-size: 22px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px; box-shadow: 0 1px 3px rgba(15, 23, 42, .05);
  }
  .card + .card { margin-top: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea, .fake-input {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    font: inherit; resize: vertical; background: #fff; color: var(--ink);
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
    padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 16px; }
  .banner {
    display: none; background: #fef2f2; color: var(--warn); border: 1px solid #fecaca;
    border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px;
  }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .badge {
    font-size: 12px; padding: 2px 10px; border-radius: 999px;
    background: var(--chip); color: #3730a3; font-weight: 600;
  }
  .badge.type-PROJECT { background: #fef3c7; color: #92400e; }
  .badge.type-SCENARIO { background: #dcfce7; color: #166534; }
  .badge.rag { background: #e0f2fe; color: #075985; }
  .badge.plain { background: var(--bg); color: var(--muted); font-weight: 500; }
  details.resume { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 14px 0; }
  details.resume summary { cursor: pointer; font-weight: 600; }
  .resume-actions { display: flex; gap: 10px; margin-top: 10px; }
  .hist-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 4px;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .hist-row:hover { background: var(--bg); }
  .hist-row .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .hist-row .what { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .question-text { font-size: 17px; font-weight: 600; margin: 0 0 14px; white-space: pre-wrap; }
  .progress { display: flex; gap: 6px; margin-bottom: 20px; }
  .dot { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
  .dot.filled { background: var(--accent); }
  .dot.current { background: #93c5fd; box-shadow: 0 0 0  1px var(--accent); }
  .nav { display: flex; justify-content: space-between; margin-top: 18px; gap: 12px; }
  .score-hero { text-align: center; margin: 6px 0 20px; }
  .score-hero .num { font-size: 52px; font-weight: 700; color: var(--accent); }
  .score-hero .denom { color: var(--muted); font-size: 20px; }
  .q-score { display: flex; gap: 12px; align-items: baseline; }
  .q-score b { color: var(--accent); font-size: 18px; }
  .verdict { margin: 4px 0; font-size: 14px; }
  .verdict .k { color: var(--muted); }
  .weak-list li, .advice-list li { margin: 6px 0; }
  .divider { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
  footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
  .spin { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>InterviewGym</h1>
    <span>AI 模拟面试官 · 贴 JD，开练</span>
  </header>

  <!-- 屏 1：输入 JD + 简历管理 -->
  <section id="screen-create" class="card">
    <div id="create-error" class="banner"></div>
    <label for="jd">目标岗位 JD</label>
    <textarea id="jd" rows="9" placeholder="把招聘 JD 原文粘进来（至少 20 字），面试官会围绕它出 10 道题：6 道八股 + 2 道项目深挖 + 2 道场景设计。"></textarea>
    <details class="resume" id="resume-box">
      <summary>我的简历（可选 · 让项目深挖题围绕你的真实项目出）</summary>
      <div id="resume-status" class="hint" style="margin-top:10px">检查中…</div>
      <textarea id="resume" rows="6" placeholder="粘贴简历全文（至少 100 字）。保存后切块建索引，出题时自动检索相关片段注入。"></textarea>
      <div id="resume-error" class="banner"></div>
      <div class="resume-actions">
        <button class="ghost" id="btn-resume-save">保存并索引</button>
        <button class="ghost" id="btn-resume-delete">删除简历</button>
      </div>
    </details>
    <p class="hint">已存简历时出题会自动结合简历；数据存本地 SQLite 文件，跨天可查，仅发送至你配置的 LLM 端点。</p>
    <button id="btn-start">开始面试</button>
  </section>

  <!-- 历史练习 -->
  <section id="history-card" class="card" style="display:none">
    <h3 style="margin:0 0 6px">历史练习</h3>
    <p class="hint" style="margin:0 0 4px">点击任意一场：已评估的看报告，没答完的继续作答。</p>
    <div id="history-list"></div>
  </section>

  <!-- 屏 2：逐题作答 -->
  <section id="screen-interview" class="card" style="display:none">
    <div id="interview-error" class="banner"></div>
    <div class="progress" id="progress"></div>
    <div class="badges" id="q-badges"></div>
    <p class="question-text" id="q-text"></p>
    <textarea id="answer" rows="9" placeholder="像面试一样口述作答，想到什么写什么，写完点下一题。"></textarea>
    <div class="nav">
      <button class="ghost" id="btn-prev">上一题</button>
      <button id="btn-next">下一题</button>
    </div>
  </section>

  <!-- 屏 3：评估报告 -->
  <section id="screen-report" class="card" style="display:none">
    <div class="score-hero">
      <span class="num" id="r-avg"></span><span class="denom"> / 5</span>
      <div class="hint" id="r-summary" style="margin:8px 0 0"></div>
    </div>
    <h3 style="margin-bottom:6px">薄弱知识点</h3>
    <ul class="weak-list" id="r-weak"></ul>
    <hr class="divider">
    <h3 style="margin-bottom:6px">复习建议</h3>
    <ol class="advice-list" id="r-advice"></ol>
    <hr class="divider">
    <div id="r-per-question"></div>
    <div class="nav">
      <span></span>
      <button id="btn-again">再来一场</button>
    </div>
  </section>

  <footer>InterviewGym v2 · 数据存于本地 SQLite（backend/data/）· 仅发送至你配置的 LLM 端点</footer>
</div>

<script>
"use strict";

const TYPE_LABEL = { FUNDAMENTAL: "八股", PROJECT: "项目深挖", SCENARIO: "场景设计" };
const DIFFICULTY_LABEL = { BASIC: "基础", MEDIUM: "中等", HARD: "较难" };

let session = null;      // { id, status, questions, answers, resumeAssisted }
let answers = {};        // questionId -> text
let currentIndex = 0;
let busy = false;

const $ = (id) => document.getElementById(id);

function show(screen) {
  for (const id of ["screen-create", "screen-interview", "screen-report"]) {
    $(id).style.display = id === screen ? "" : "none";
  }
  $("history-card").style.display = screen === "screen-create" ? "" : "none";
}

function showError(where, message) {
  const el = $(where);
  el.textContent = message;
  el.style.display = message ? "" : "none";
}

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    const err = new Error(body.error || ("请求失败（HTTP " + response.status + "）"));
    err.status = response.status;
    throw err;
  }
  return body;
}

/* ---------- 简历管理 ---------- */

function renderResumeStatus(status) {
  const el = $("resume-status");
  if (!status) {
    el.textContent = "未上传。上传后项目深挖题将围绕简历中的真实项目出题（需服务端配置 LLM_EMBEDDING_MODEL 环境变量）。";
    return;
  }
  el.textContent = "已索引：切块 " + status.chunkCount + " 块 · 模型 " + status.embedModel +
    " · 更新于 " + new Date(status.updatedAt).toLocaleString();
}

async function loadResume() {
  try {
    const status = await api("/api/resume");
    renderResumeStatus(status);
    $("resume").value = status.sourceText || "";
  } catch (e) {
    if (e.status === 404) renderResumeStatus(null);
    else renderResumeStatus(null);
  }
}

async function saveResume() {
  if (busy) return;
  const text = $("resume").value.trim();
  if (text.length < 100) {
    showError("resume-error", "简历至少 100 字，切不出有效内容没法建索引。");
    return;
  }
  busy = true;
  const btn = $("btn-resume-save");
  btn.disabled = true;
  btn.textContent = "切块 + 向量化中…";
  showError("resume-error", "");
  try {
    renderResumeStatus(await api("/api/resume", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text }),
    }));
  } catch (e) {
    showError("resume-error", e.message);
  } finally {
    busy = false;
    btn.disabled = false;
    btn.textContent = "保存并索引";
  }
}

async function deleteResume() {
  try {
    await api("/api/resume", { method: "DELETE" });
    $("resume").value = "";
    renderResumeStatus(null);
    showError("resume-error", "");
  } catch (e) {
    showError("resume-error", e.message);
  }
}

/* ---------- 历史练习 ---------- */

async function loadHistory() {
  try {
    const list = await api("/api/interviews");
    if (!list.length) return;
    $("history-list").innerHTML = list
      .map((s) => {
        const score = s.averageScore == null ? "" :
          '<span class="badge plain">' + Number(s.averageScore).toFixed(1) + " 分</span>";
        const rag = s.resumeAssisted ? '<span class="badge rag">简历</span>' : "";
        const state = s.status === "EVALUATED" ? "" : '<span class="badge type-PROJECT">未完成</span>';
        return '<div class="hist-row" data-id="' + s.id + '">' +
          '<span class="when">' + new Date(s.createdAt).toLocaleString() + "</span>" +
          '<span class="what">' + escapeHtml(s.jdExcerpt) + "</span>" +
          state + rag + score + "</div>";
      })
      .join("");
    $("history-list").querySelectorAll(".hist-row").forEach((row) =>
      row.addEventListener("click", () => openHistory(row.dataset.id)));
    $("history-card").style.display = "";
  } catch (e) {
    /* 历史加载失败不阻断主流程 */
  }
}

async function openHistory(id) {
  try {
    session = await api("/api/interviews/" + id);
    if (session.status === "EVALUATED") {
      const report = await api("/api/interviews/" + id + "/report");
      renderReport(report);
      show("screen-report");
    } else {
      // 未完成：用服务端已存的答案续答（本地作答状态由 answers 重建）
      answers = {};
      for (const [qid, answer] of Object.entries(session.answers || {})) {
        answers[qid] = answer.text;
      }
      currentIndex = session.questions.findIndex((q) => !answers[q.id]);
      if (currentIndex < 0) currentIndex = session.questions.length - 1;
      renderQuestion();
      show("screen-interview");
    }
  } catch (e) {
    showError("create-error", e.message);
  }
}

/* ---------- 屏 1 → 屏 2 ---------- */

async function startInterview() {
  if (busy) return;
  const jd = $("jd").value.trim();
  if (jd.length < 20) {
    showError("create-error", "JD 至少要 20 字，否则面试官无从出题。");
    return;
  }
  busy = true;
  const btn = $("btn-start");
  btn.disabled = true;
  btn.textContent = "面试官正在出题…（约 30~60 秒）";
  btn.classList.add("spin");
  showError("create-error", "");
  try {
    session = await api("/api/interviews", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ jdText: jd }),
    });
    answers = {};
    currentIndex = 0;
    renderQuestion();
    show("screen-interview");
  } catch (e) {
    showError("create-error", e.message);
  } finally {
    busy = false;
    btn.disabled = false;
    btn.textContent = "开始面试";
    btn.classList.remove("spin");
  }
}

/* ---------- 屏 2：逐题作答 ---------- */

function renderQuestion() {
  const question = session.questions[currentIndex];
  $("progress").innerHTML = session.questions
    .map((q, i) => {
      let cls = "dot";
      if (i === currentIndex) cls += " current";
      else if (answers[q.id]) cls += " filled";
      return '<div class="' + cls + '"></div>';
    })
    .join("");
  $("q-badges").innerHTML =
    '<span class="badge type-' + question.type + '">' + TYPE_LABEL[question.type] + "</span>" +
    '<span class="badge plain">' + DIFFICULTY_LABEL[question.difficulty] + "</span>" +
    '<span class="badge plain">' + escapeHtml(question.knowledgePoint) + "</span>" +
    (session.resumeAssisted ? '<span class="badge rag">已结合简历</span>' : "");
  $("q-text").textContent = "第 " + question.index + " 题 · " + question.content;
  $("answer").value = answers[question.id] || "";
  $("btn-prev").disabled = currentIndex === 0;
  const isLast = currentIndex === session.questions.length - 1;
  $("btn-next").textContent = isLast ? "交卷，出评估报告" : "下一题";
}

function saveCurrentAnswer() {
  const question = session.questions[currentIndex];
  answers[question.id] = $("answer").value.trim();
}

function gotoQuestion(index) {
  saveCurrentAnswer();
  currentIndex = Math.max(0, Math.min(session.questions.length - 1, index));
  renderQuestion();
}

async function submitAll() {
  if (busy) return;
  saveCurrentAnswer();
  const unanswered = session.questions.filter((q) => !answers[q.id]);
  if (unanswered.length > 0) {
    showError("interview-error",
      "还有 " + unanswered.length + " 题没作答（第 " +
      unanswered.map((q) => q.index).join("、") + " 题）。都答完才能评估。");
    return;
  }
  busy = true;
  const btn = $("btn-next");
  btn.disabled = true;
  btn.textContent = "面试官正在批改…（约 30~60 秒）";
  btn.classList.add("spin");
  showError("interview-error", "");
  try {
    for (const question of session.questions) {
      await api("/api/interviews/" + session.id + "/answers", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ questionId: question.id, text: answers[question.id] }),
      });
    }
    const report = await api("/api/interviews/" + session.id + "/evaluate", { method: "POST" });
    renderReport(report);
    show("screen-report");
    loadHistory();
  } catch (e) {
    showError("interview-error", e.message);
  } finally {
    busy = false;
    btn.disabled = false;
    btn.textContent = "交卷，出评估报告";
    btn.classList.remove("spin");
  }
}

/* ---------- 屏 3：报告 ---------- */

function renderReport(report) {
  $("r-avg").textContent = report.averageScore.toFixed(1);
  $("r-summary").textContent = (session.resumeAssisted ? "本场已结合简历出题 · " : "") + report.summary;
  $("r-weak").innerHTML = report.weakPoints.length === 0
    ? '<li class="hint">没有明显短板，保持。</li>'
    : report.weakPoints
        .map((w) => "<li><b>" + escapeHtml(w.knowledgePoint) + "</b> — " + escapeHtml(w.reason) + "</li>")
        .join("");
  $("r-advice").innerHTML = report.reviewAdvice
    .map((a) => "<li>" + escapeHtml(a) + "</li>")
    .join("");
  const byId = {};
  report.perQuestion.forEach((p) => (byId[p.questionId] = p));
  $("r-per-question").innerHTML = session.questions
    .map((q) => {
      const score = byId[q.id];
      if (!score) return "";
      return (
        '<div style="margin:14px 0">' +
        '<div class="q-score"><span class="badge type-' + q.type + '">' + TYPE_LABEL[q.type] + "</span>" +
        "<b>" + score.score + "</b><span class='denom' style='font-size:13px'>/ 5</span>" +
        '<span style="font-weight:600">' + escapeHtml(q.knowledgePoint) + "</span></div>" +
        '<p class="question-text" style="font-size:14px;font-weight:500">' + escapeHtml(q.content) + "</p>" +
        '<p class="verdict"><span class="k">亮点：</span>' + escapeHtml(score.strength) + "</p>" +
        '<p class="verdict"><span class="k">改进：</span>' + escapeHtml(score.improvement) + "</p>" +
        "</div><hr class='divider'>"
      );
    })
    .join("");
}

/* ---------- 事件绑定与初始化 ---------- */

$("btn-start").addEventListener("click", startInterview);
$("btn-prev").addEventListener("click", () => gotoQuestion(currentIndex - 1));
$("btn-next").addEventListener("click", () => {
  const isLast = currentIndex === session.questions.length - 1;
  if (isLast) submitAll();
  else gotoQuestion(currentIndex + 1);
});
$("btn-again").addEventListener("click", () => {
  session = null;
  answers = {};
  $("jd").value = "";
  show("screen-create");
  loadHistory();
});
$("btn-resume-save").addEventListener("click", saveResume);
$("btn-resume-delete").addEventListener("click", deleteResume);

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text == null ? "" : String(text);
  return div.innerHTML;
}

loadResume();
loadHistory();
</script>
</body>
</html>
