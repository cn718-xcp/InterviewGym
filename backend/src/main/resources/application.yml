spring:
  application:
    name: interview-gym
  servlet:
    multipart:
      max-file-size: 20MB            # v3 语音录音上传上限（D014，前端 5 分钟自动停录双保险）
      max-request-size: 25MB
      file-size-threshold: 20MB      # 审查轮修正：默认 0 会把上传先写进 Tomcat 磁盘临时文件——违 D015「不写临时文件」；阈值=max 上限 → 录音全程留内存
  datasource:
    # SQLite 单文件库（D010）：默认相对运行目录 backend/data/（.gitignore 已挡 *.db 与 backend/data/）
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:data/interviewgym.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1  # SQLite 单写者：串行访问，避免 database locked
  sql:
    init:
      mode: always  # schema.sql 为幂等 DDL（CREATE TABLE IF NOT EXISTS），每次启动安全执行

server:
  port: 8080

# LLM 端点：任一 OpenAI 兼容服务均可（GLM / DeepSeek / Qwen ...）
# 密钥只从环境变量注入 —— AGENTS.md 红线 1
llm:
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:}
  embedding-model: ${LLM_EMBEDDING_MODEL:}        # v2 简历 RAG 用（D011），如 embedding-3；不配则 RAG 关闭
  embedding-base-url: ${LLM_EMBEDDING_BASE_URL:}  # D013：chat 与嵌入不同服务商时独立配置（如 DeepSeek chat + 智谱 embedding）；空 = 复用 base-url
  embedding-api-key: ${LLM_EMBEDDING_API_KEY:}    # 空 = 复用 api-key
  asr-model: ${LLM_ASR_MODEL:}                    # v3 语音作答用（D014），如 FunAudioLLM/SenseVoiceSmall；不配则语音关闭
  asr-base-url: ${LLM_ASR_BASE_URL:}              # D014：ASR 独立服务商时配置（如硅基流动）；空 = 复用 base-url
  asr-api-key: ${LLM_ASR_API_KEY:}                # 空 = 复用 api-key
  read-timeout-seconds: ${LLM_READ_TIMEOUT_SECONDS:90}
